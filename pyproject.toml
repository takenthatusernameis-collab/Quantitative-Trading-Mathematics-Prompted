[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtr"
version = "0.1.0"
description = "Mathematics-guided quantitative trading research"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.0", "ccxt>=4.0.0"]
test = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]
opt = ["optuna>=3.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"