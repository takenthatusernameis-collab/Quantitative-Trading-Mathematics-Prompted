[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtr"
version = "0.1.0"
description = "Mathematics-guided quantitative trading research"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.0", "ccxt>=4.0.0"]
test = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]
opt = ["optuna>=3.0.0"]
lint = ["ruff>=0.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The package uses a src/ layout and is not required to be pip-installed for
# the test suite to run: pytest prepends these paths to sys.path, so
# `python -m pytest` works from a bare clone with no install step (and no
# network). Without this, every test module that imports `qtr` fails at
# collection with ModuleNotFoundError unless `pip install -e .` was run.
pythonpath = ["src"]

[tool.coverage.run]
# The coverage gate measures the package, with BRANCH coverage enabled.
# Statement coverage alone cannot see a guard that is never taken, and
# every defect the first real branch measurement found was exactly that:
# a defensive branch that no test had ever executed.
branch = true
source = ["src/qtr"]

[tool.coverage.report]
# The gate fails below full coverage of src/qtr. Measured with:
#   python -m pytest -q --cov=qtr --cov-branch --cov-report=term-missing
# (pytest-cov is declared under [project.optional-dependencies] test).
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E402", "E741", "F841", "F401", "E501", "E722"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"