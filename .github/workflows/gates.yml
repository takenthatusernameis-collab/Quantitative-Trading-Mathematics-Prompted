name: Research gates

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "run_*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/gates.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "run_*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install lint dependencies
        run: python -m pip install --quiet ruff

      - name: Ruff lint
        run: python -m ruff check src tests run_*.py

      - name: Ruff format check
        run: python -m ruff format --check src tests run_*.py

  research_gates:
    name: Research gates (tests + 100% coverage)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet pytest pytest-cov

      - name: Run research gates
        run: python -m pytest -q -W error --cov=qtr --cov-branch --cov-report=term-missing