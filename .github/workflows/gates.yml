name: Research gates

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "run_*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/gates.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "run_*.py"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

# The gates in AGENTS.md and pyproject.toml are the research contract: the
# suite must pass with warnings-as-errors, the lint and format gates must be
# clean, and `src/qtr` must stay at 100% statement+branch coverage
# (`[tool.coverage.report] fail_under = 100`). Until this workflow existed,
# those invariants were enforced only by hand in every session handoff -- and
# every real defect the record found under `src/qtr` (H60, H61, H62, H67, H75)
# was a regression that a gated run would have caught at the commit that
# introduced it. The gates are split into a fast job and a full-suite job so a
# style regression fails in seconds rather than after the eight-minute suite.
jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: python -m ruff check src tests run_*.py
      - name: Ruff format check
        run: python -m ruff format --check src tests run_*.py

  research_gates:
    name: Test suite and coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # One invocation: `-W error` promotes every warning to an error (the
      # documented suite invocation in AGENTS.md) and `--cov` enforces the
      # 100% statement+branch gate declared in pyproject.toml
      # (`fail_under = 100`, `branch = true`). A drop below full coverage of
      # `src/qtr` fails the build rather than merely reporting it.
      - name: Run the research gates
        run: python -m pytest -q -W error --cov=qtr --cov-branch --cov-report=term-missing